<!DOCTYPE html>
<html lang="sv">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin | Adams Service Bilverkstad</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

</head>


<body>

    <header class="header">

        <div class="container nav-container">

            <a href="index.html" class="logo">

                <img src="images/adams-logo.png"
                     alt="Adams Service Bilverkstad"
                     class="logo-image">

            </a>

            <h2>
                Adams Service — Admin
            </h2>

        </div>

    </header>


    <main>

        <section class="booking-section">

            <div class="container">

                <div class="section-heading">

                    <p class="section-label">
                        ADMINISTRATION
                    </p>

                    <h1>
                        Bokningar
                    </h1>

                    <p>
                        Här kommer Adams bokningar att visas.
                    </p>

                </div>


                <!-- BOOKINGS WILL APPEAR HERE -->

                <!-- ================= ADMIN LOGIN ================= -->

<div id="admin-login">

    <div class="contact-card">

        <h2>
            Admininloggning
        </h2>

        <p>
            Logga in för att se Adams Service bokningar.
        </p>

        <form id="login-form">

            <div class="form-group">

                <label for="admin-email">
                    E-post
                </label>

                <input type="email"
                       id="admin-email"
                       autocomplete="email"
                       placeholder="Admin e-post"
                       required>

            </div>

            <div class="form-group">

                <label for="admin-password">
                    Lösenord
                </label>

                <input type="password"
                       id="admin-password"
                       autocomplete="current-password"
                       placeholder="Lösenord"
                       required>

            </div>

            <button type="submit"
                    class="primary-button">

                Logga in

            </button>

        </form>

        <p id="login-error"
           style="display:none;">

        </p>

    </div>

</div>


<!-- ================= BOOKINGS ================= -->

<div id="admin-content"
     style="display:none;">

    <div id="bookings-container">

        <p>
            Laddar bokningar...
        </p>

    </div>

</div>

            </div>

        </section>

    </main>


    <footer class="footer">

        <div class="container footer-content">

            <div>

                <strong>
                    Adams Service Bilverkstad
                </strong>

                <p>
                    Låsbomsgatan 11, 589 41 Linköping
                </p>

            </div>

        </div>

    </footer>


   <script>

    /* ==========================================
       LOAD BOOKINGS FROM SUPABASE
       ========================================== */

    async function loadBookings() {

        const container =
            document.getElementById("bookings-container");


        const {
            data: bookings,
            error
        } = await supabaseClient
            .from("bookings")
            .select("*")
            .order("booking_date", {
                ascending: true
            })
            .order("booking_time", {
                ascending: true
            });


        /* ==========================================
           CHECK FOR ERROR
           ========================================== */

        if (error) {

            console.error(
                "Supabase error:",
                error
            );

            container.innerHTML = `
                <p>
                    Kunde inte läsa bokningarna.
                </p>
            `;

            return;

        }


        /* ==========================================
           NO BOOKINGS
           ========================================== */

        if (!bookings || bookings.length === 0) {

            container.innerHTML = `
                <p>
                    Det finns inga bokningar ännu.
                </p>
            `;

            return;

        }


        /* ==========================================
           CREATE TABLE
           ========================================== */

        let tableHTML = `

            <div class="admin-table-wrapper">

                <table class="admin-bookings-table">

                    <thead>

                        <tr>

                            <th>Datum</th>

                            <th>Tid</th>

                            <th>Kund</th>

                            <th>Telefon</th>

                            <th>E-post</th>

                            <th>Tjänst</th>

                            <th>Meddelande</th>

                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody>
        `;


        /* ==========================================
           ADD BOOKINGS
           ========================================== */

        bookings.forEach(function(booking) {

            tableHTML += `

                <tr>

                    <td>
                        ${booking.booking_date || ""}
                    </td>

                    <td>
                        ${booking.booking_time || ""}
                    </td>

                    <td>
                        ${booking.customer_name || ""}
                    </td>

                    <td>
                        ${booking.customer_phone || ""}
                    </td>

                    <td>
                        ${booking.customer_email || ""}
                    </td>

                    <td>
                        ${booking.service || ""}
                    </td>

                    <td>
                        ${booking.message || ""}
                    </td>

                    <td>
                        ${booking.status || "pending"}
                    </td>

                </tr>

            `;

        });


        tableHTML += `

                    </tbody>

                </table>

            </div>

        `;


        container.innerHTML =
            tableHTML;

    }


    /* ==========================================
       START
       ========================================== */

    loadBookings();

</script>

</body>

</html>
