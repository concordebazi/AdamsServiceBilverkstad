<!DOCTYPE html>
<html lang="sv">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin | Adams Service Bilverkstad</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

</head>


<body>

    <header class="header">

        <div class="container nav-container">

            <a href="index.html" class="logo">

                <img src="images/adams-logo.png"
                     alt="Adams Service Bilverkstad"
                     class="logo-image">

            </a>

            <h2>
                Adams Service — Admin
            </h2>

        </div>

    </header>


    <main>

        <section class="booking-section">

            <div class="container">

                <div class="section-heading">

                    <p class="section-label">
                        ADMINISTRATION
                    </p>

                    <h1>
                        Bokningar
                    </h1>

                    <p>
                        Här kommer Adams bokningar att visas.
                    </p>

                </div>


                <!-- BOOKINGS WILL APPEAR HERE -->

                <!-- ================= ADMIN LOGIN ================= -->

<div id="admin-login">

    <div class="contact-card">

        <h2>
            Admininloggning
        </h2>

        <p>
            Logga in för att se Adams Service bokningar.
        </p>

        <form id="login-form">

            <div class="form-group">

                <label for="admin-email">
                    E-post
                </label>

                <input type="email"
                       id="admin-email"
                       autocomplete="email"
                       placeholder="Admin e-post"
                       required>

            </div>

            <div class="form-group">

                <label for="admin-password">
                    Lösenord
                </label>

                <input type="password"
                       id="admin-password"
                       autocomplete="current-password"
                       placeholder="Lösenord"
                       required>

            </div>

            <button type="submit"
                    class="primary-button">

                Logga in

            </button>

        </form>

        <p id="login-error"
           style="display:none;">

        </p>

    </div>

</div>


<!-- ================= BOOKINGS ================= -->

<div id="admin-content"
     style="display:none;">
<button
    type="button"
    id="refresh-bookings"
    class="primary-button"
    style="margin-bottom: 20px;">

    🔄 Uppdatera bokningar

</button>
    <div id="bookings-container">

        <p>
            Laddar bokningar...
        </p>

    </div>

</div>

            </div>

        </section>

    </main>


    <footer class="footer">

        <div class="container footer-content">

            <div>

                <strong>
                    Adams Service Bilverkstad
                </strong>

                <p>
                    Låsbomsgatan 11, 589 41 Linköping
                </p>

            </div>

        </div>

    </footer>


   <script>

    /* ==========================================
       LOAD BOOKINGS FROM SUPABASE
       ========================================== */
/* ==========================================
   ADMIN LOGIN
   ========================================== */

const loginForm =
    document.getElementById("login-form");

const adminLogin =
    document.getElementById("admin-login");

const adminContent =
    document.getElementById("admin-content");

const loginError =
    document.getElementById("login-error");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("admin-email").value;

        const password =
            document.getElementById("admin-password").value;


        const {
            data,
            error
        } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });


        if (error) {

            console.error(
                "Login error:",
                error
            );

            loginError.textContent =
                "Fel e-postadress eller lösenord.";

            loginError.style.display =
                "block";

            return;

        }


        console.log(
            "Admin logged in:",
            data.user
        );


        adminLogin.style.display =
            "none";

        adminContent.style.display =
            "block";


        loadBookings();

    }
);
    async function loadBookings() {

        const container =
            document.getElementById("bookings-container");


        const {
            data: bookings,
            error
        } = await supabaseClient
            .from("bookings")
            .select("*")
            .order("booking_date", {
                ascending: true
            })
            .order("booking_time", {
                ascending: true
            });


        /* ==========================================
           CHECK FOR ERROR
           ========================================== */

        if (error) {

            console.error(
                "Supabase error:",
                error
            );

            container.innerHTML = `
                <p>
                    Kunde inte läsa bokningarna.
                </p>
            `;

            return;

        }


        /* ==========================================
           NO BOOKINGS
           ========================================== */

        if (!bookings || bookings.length === 0) {

            container.innerHTML = `
                <p>
                    Det finns inga bokningar ännu.
                </p>
            `;

            return;

        }


        /* ==========================================
           CREATE TABLE
           ========================================== */

        let tableHTML = `

            <div class="admin-table-wrapper">

                <table class="admin-bookings-table">

                    <thead>

                        <tr>

                            <th>Datum</th>

                            <th>Tid</th>

                            <th>Kund</th>

                            <th>Telefon</th>

                            <th>E-post</th>

                            <th>Tjänst</th>

                            <th>Meddelande</th>

                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody>
        `;


        /* ==========================================
           ADD BOOKINGS
           ========================================== */

        bookings.forEach(function(booking) {

            tableHTML += `

               <tr class="booking-row status-${booking.status || 'pending'}">

                    <td>
                        ${booking.booking_date || ""}
                    </td>

                    <td>
                        ${booking.booking_time || ""}
                    </td>

                   <td>

    <button
        type="button"
        class="customer-details-button"
        data-id="${booking.id}">

        ${booking.customer_name || ""}

    </button>

</td>

                    <td>

    <a href="tel:${booking.customer_phone || ""}"
       class="admin-contact-link">

        ${booking.customer_phone || ""}

    </a>

</td>>

                   <td>

    <a href="mailto:${booking.customer_email || ""}"
       class="admin-contact-link">

        ${booking.customer_email || ""}

    </a>

</td>

                    <td>
                        ${booking.service || ""}
                    </td>

                    <td>
                        ${booking.message || ""}
                    </td>

                    <td>

    <select
        class="booking-status"
        data-id="${booking.id}">

        <option value="pending"
            ${booking.status === "pending" ? "selected" : ""}>
            🟡 Pending
        </option>

        <option value="confirmed"
            ${booking.status === "confirmed" ? "selected" : ""}>
            🟢 Confirmed
        </option>

        <option value="completed"
            ${booking.status === "completed" ? "selected" : ""}>
            🔵 Completed
        </option>

        <option value="cancelled"
            ${booking.status === "cancelled" ? "selected" : ""}>
            🔴 Cancelled
        </option>

    </select>

</td>

                </tr>

            `;

        });


        tableHTML += `

                    </tbody>

                </table>

            </div>

        `;


        container.innerHTML =
            tableHTML;

    }


    /* ==========================================
       START
       ========================================== */


    /* ==========================================
       UPDATE BOOKING STATUS
       ========================================== */

    document.addEventListener(
        "change",
        async function(event) {

            if (
                !event.target.classList.contains("booking-status")
            ) {
                return;
            }


            const bookingId =
                event.target.dataset.id;


            const newStatus =
                event.target.value;


            const {
                error
            } = await supabaseClient
                .from("bookings")
                .update({
                    status: newStatus
                })
                .eq("id", bookingId);


            if (error) {

                console.error(
                    "Status update error:",
                    error
                );

                alert(
                    "Kunde inte uppdatera status."
                );

                return;

            }


            console.log(
                "Booking status updated:",
                bookingId,
                newStatus
            );

        }
    );

/* ==========================================
   MANUAL REFRESH BOOKINGS
   ========================================== */

const refreshBookingsButton =
    document.getElementById("refresh-bookings");


refreshBookingsButton.addEventListener(
    "click",
    async function() {

        refreshBookingsButton.textContent =
            "🔄 Uppdaterar...";

        refreshBookingsButton.disabled =
            true;


        await loadBookings();


        refreshBookingsButton.textContent =
            "🔄 Uppdatera bokningar";

        refreshBookingsButton.disabled =
            false;

    }
);
       /* ==========================================
   REALTIME BOOKING UPDATES
   ========================================== */

const bookingsChannel =
    supabaseClient
        .channel("bookings-realtime")
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "bookings"
            },
            async function(payload) {

                console.log(
                    "Realtime booking change:",
                    payload
                );

                const {
                    data: {
                        session
                    }
                } =
                    await supabaseClient.auth.getSession();


                if (session) {

                    loadBookings();

                }

            }
        )
        .subscribe();
</script>

</body>

</html>
